name: Publish Inferzero image

on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact upstream release tag (blank selects latest stable)
        required: false
        type: string
  push:
    tags:
      - 'inferzero-*'
  # Upstream publishes several releases a day. Every 3 hours, publish the latest stable one
  # if this registry does not have it yet; otherwise the run stops after the check.
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: inferzero-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/inferzero
    steps:
      - uses: actions/checkout@v4
      - name: Select release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE: ${{ inputs.release }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          requested="$INPUT_RELEASE"
          if [ "$EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/inferzero-* ]]; then
            requested="${REF_NAME#inferzero-}"
          fi
          release_list=$(mktemp)
          trap 'rm -f "$release_list"' EXIT
          gh api "repos/rizagp/inferzero/releases?per_page=100" > "$release_list"
          python3 .github/scripts/select_inferzero_release.py "$requested" < "$release_list" > release-selection.txt
          cat release-selection.txt
          while IFS='=' read -r key value; do echo "$key=$value" >> "$GITHUB_OUTPUT"; done < release-selection.txt
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Check what the registry already has
        id: registry
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE: ${{ steps.release.outputs.release }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          set -eu
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true; }
          release_digest=$(digest_of "$IMAGE:$RELEASE")
          latest_digest=$(digest_of "$IMAGE:latest")
          echo "registry $IMAGE:$RELEASE = ${release_digest:-missing}; :latest = ${latest_digest:-missing}"
          build=true retag=false
          # Only the scheduled check skips work; a manual run or a pushed tag always rebuilds.
          if [ "$EVENT_NAME" = schedule ] && [ -n "$release_digest" ]; then
            build=false
            if [ "$LATEST" = true ] && [ "$release_digest" != "$latest_digest" ]; then retag=true; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "retag=$retag" >> "$GITHUB_OUTPUT"
          echo "build=$build retag=$retag"
      - name: Point latest at the existing release image
        if: steps.registry.outputs.retag == 'true'
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE"
      - name: Verify upstream release and capture Linux asset digest
        if: steps.registry.outputs.build == 'true'
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -eu
          gh api "repos/rizagp/inferzero/releases/tags/$RELEASE" --jq '[.assets[] | select(.name | endswith("linux-x64.tar.gz"))][0] | [.name, .digest] | @tsv' > asset.tsv
          IFS="$(printf '\t')" read -r name digest < asset.tsv
          test -n "$name"
          case "$digest" in sha256:*) echo "sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT" ;; *) echo "Missing release asset sha256" >&2; exit 1 ;; esac
      - uses: docker/metadata-action@v5
        if: steps.registry.outputs.build == 'true'
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.release.outputs.release }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest }}
      - name: Build for the smoke test
        if: steps.registry.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/inferzero
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            INFERZERO_RELEASE=${{ steps.release.outputs.release }}
            INFERZERO_ASSET_SHA256=${{ steps.asset.outputs.sha256 }}
          tags: inferzero-smoke:test
          cache-to: type=gha,mode=max
      - name: Smoke test (no GPU on the runner, so binaries and libraries only)
        if: steps.registry.outputs.build == 'true'
        run: |
          set -eu
          docker run --rm --entrypoint /bin/sh inferzero-smoke:test -c '
            set -eu
            cd /opt/inferzero
            for b in serverz runz mgpu_probe; do test -x "bin/$b" || { echo "missing bin/$b" >&2; exit 1; }; done
            test -x zero-launcher.sh || { echo "missing zero-launcher.sh" >&2; exit 1; }
            command -v pdfinfo >/dev/null || { echo "missing pdfinfo (poppler-utils)" >&2; exit 1; }
            command -v pdftoppm >/dev/null || { echo "missing pdftoppm (poppler-utils)" >&2; exit 1; }
            if ldd bin/serverz | grep "not found"; then echo "serverz has unresolved libraries" >&2; exit 1; fi
            echo "smoke test passed: $(cat bin/PREBUILT.txt 2>/dev/null | head -n 1)"
          '
      - name: Publish
        if: steps.registry.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/inferzero
          platforms: linux/amd64
          push: true
          build-args: |
            INFERZERO_RELEASE=${{ steps.release.outputs.release }}
            INFERZERO_ASSET_SHA256=${{ steps.asset.outputs.sha256 }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
